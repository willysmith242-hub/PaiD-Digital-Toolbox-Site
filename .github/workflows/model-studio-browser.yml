name: Model Studio browser checks
on:
  workflow_run:
    workflows: ["Deploy PaiD Digital Toolbox Site to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-studio:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      PAID_BASE_URL: https://willysmith242-hub.github.io/PaiD-Digital-Toolbox-Site/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - name: Wait for deployed Model Studio
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent "$PAID_BASE_URL/modeller.html" | grep -q 'Parametric Model Studio'; then exit 0; fi
            sleep 10
          done
          echo "Model Studio page did not become available"
          exit 1
      - name: Test Model Studio in mobile browser
        run: node tests/modeller-browser-smoke.mjs
        env:
          PAID_BASE_URL: https://willysmith242-hub.github.io/PaiD-Digital-Toolbox-Site/
