name: Deploy PaiD Digital Toolbox Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clone converter source
        run: git clone --depth 1 https://github.com/ek-mc/pdf-to-dxf.git converter-src
      - name: Build converter library from source
        working-directory: converter-src
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile
          pnpm run build:lib
          pnpm test
          test -s dist/pdf-to-dxf.mjs
      - name: Install site bundler
        run: npm install --no-save --no-package-lock vite@8
      - name: Build local PDF-to-DXF engine
        run: |
          mkdir -p vendor
          npx vite build --config vite.pdfdxf.config.js
          test -s vendor/pdf-to-dxf.bundle.js
          find vendor -maxdepth 1 -type f -printf "%f\\n"
          test -s vendor/pdf-worker-pdf.worker.min.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
